<style>
:root{color-scheme:dark;--bg:#0b1020;--surface:#111a2d;--surface2:#17233a;--surface3:#1d2b45;--line:#293955;--text:#edf2fa;--muted:#9aabc4;--gold:#e4b96b;--gold2:#f2d69a;--teal:#67c8b6;--red:#ef8585;--shadow:0 18px 55px #0005;--radius:18px}
:root[data-theme="light"]{color-scheme:light;--bg:#f1f3f7;--surface:#fff;--surface2:#f7f8fb;--surface3:#edf0f6;--line:#d9dfeb;--text:#172239;--muted:#61708a;--gold:#9b6b1e;--gold2:#795013;--teal:#197b6c;--red:#bb4848;--shadow:0 15px 45px #26334a12}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 10% -10%,#a77a2925,transparent 38%),var(--bg);color:var(--text);font:15px/1.55 "DM Sans",system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--gold)}
.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:25px 17px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;z-index:5;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#f0cf8e,#a8752f);display:grid;place-items:center;color:#1b1b20;font-size:23px;box-shadow:0 8px 22px #b8863b33}.brand strong{font:800 19px "Playfair Display",serif;letter-spacing:.02em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.19em;text-transform:uppercase}
.nav-label{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);padding:0 11px;margin-bottom:5px}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;border-radius:12px;background:transparent;color:var(--muted);text-align:left;padding:11px 13px;display:flex;align-items:center;gap:12px;font-weight:600;transition:.18s}.nav button:hover{background:var(--surface2);color:var(--text)}.nav button.active{background:linear-gradient(100deg,#c99b4d25,#c99b4d08);color:var(--gold2);box-shadow:inset 3px 0 var(--gold)}.nav .ico{width:21px;text-align:center;font-size:17px}
.side-bottom{margin-top:auto;display:grid;gap:10px}.sync-pill{border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:12px}.sync-pill b{color:var(--teal)}
.main{min-width:0;padding:28px clamp(16px,4vw,56px) 60px;max-width:1600px;width:100%;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.eyebrow{color:var(--gold);font:500 10px "DM Mono",monospace;letter-spacing:.19em;text-transform:uppercase}.page-title{font:700 clamp(27px,4vw,40px)/1.1 "Playfair Display",serif;margin:5px 0 0;letter-spacing:-.03em}.top-actions{display:flex;gap:8px;align-items:center}.icon-btn,.btn,.select-btn{border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);padding:9px 12px}.icon-btn{width:42px;height:42px;font-size:17px}.btn.primary{background:linear-gradient(135deg,#e5bd74,#bd8738);border-color:#d8a957;color:#1b1b20;font-weight:800}.btn.subtle{background:var(--surface2)}.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:hover,.icon-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.mobile-brand{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,2.6vw,27px);box-shadow:var(--shadow);margin-bottom:18px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.panel h2{font:700 22px "Playfair Display",serif;margin:0}.panel h3{font-size:15px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.mono{font:12px "DM Mono",monospace}.gold{color:var(--gold)}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}textarea{min-height:95px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d5a64b22}.field{min-width:0}.field + .field{margin-top:12px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}.stat .value{font:700 25px "Playfair Display",serif;color:var(--gold2)}.stat .caption{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:2px}
.ability-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.ability{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 7px;text-align:center}.ability label{font-size:10px;letter-spacing:.08em;text-transform:uppercase}.ability input{text-align:center;padding:8px 2px;font:700 22px "Playfair Display",serif}.ability .modifier{font:700 17px "DM Mono",monospace;color:var(--gold);margin-top:5px}
.skill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}.skill{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.skill input{width:16px;height:16px;accent-color:var(--gold)}.skill span:last-child{margin-left:auto;font:12px "DM Mono",monospace;color:var(--gold)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar input{flex:1;min-width:190px}.toolbar select{width:auto;min-width:140px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.content-card{border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:15px;display:flex;flex-direction:column;gap:9px;min-height:160px}.content-card h3{font:700 17px "Playfair Display",serif;margin:0}.content-card .meta{font:11px "DM Mono",monospace;color:var(--muted)}.content-card p{font-size:12px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.content-card .card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:10px;color:var(--muted);white-space:nowrap}.tag.goldtag{color:var(--gold);border-color:#c99b4d66}.tag.homebrew{color:var(--teal);border-color:#67c8b655}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}.empty .big{font-size:30px;margin-bottom:8px}
.list{display:grid;gap:8px}.list-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}.list-row .grow{flex:1;min-width:0}.list-row strong{display:block}.list-row small{color:var(--muted)}
.source-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px;max-height:420px;overflow:auto;padding:2px}.source-option{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:12px;color:var(--text);margin:0}.source-option input{width:15px;height:15px;margin:2px 0 0;accent-color:var(--gold)}.source-option small{display:block;color:var(--muted);font:10px "DM Mono",monospace}
.divider{height:1px;background:var(--line);margin:18px 0}.notice{border:1px solid #c99b4d55;background:#c99b4d10;border-radius:12px;padding:12px 14px;color:var(--muted);font-size:12px}.notice strong{color:var(--gold)}.status{font-size:12px;color:var(--muted);min-height:18px}.progress{height:5px;background:var(--surface3);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.modal-backdrop{position:fixed;inset:0;background:#050914bb;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.modal pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:14px;border-radius:10px;font-size:12px;max-height:45vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal h2{font:700 24px "Playfair Display",serif;margin:0}.modal-content{color:var(--muted);font-size:13px;line-height:1.7}.modal-content ul{padding-left:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--surface3);border:1px solid var(--line);border-radius:12px;padding:10px 15px;box-shadow:var(--shadow);z-index:50;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}.right{margin-left:auto}.danger-text{color:var(--red)}.character-switch{min-width:180px;max-width:260px}
@media(max-width:900px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:20px 10px}.brand{justify-content:center;padding:0}.brand-copy,.nav-label,.nav button .nav-text,.side-bottom .sync-pill{display:none}.nav button{justify-content:center;padding:13px 8px}.nav button .ico{font-size:20px}.side-bottom{justify-items:center}.main{padding:22px 18px 50px}}
@media(max-width:620px){.app{display:block}.sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);display:block}.brand,.nav-label,.side-bottom{display:none}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}.nav button{display:flex;flex-direction:column;gap:2px;padding:6px 2px;font-size:10px;border-radius:9px}.nav button .nav-text{display:block!important}.nav button .ico{font-size:17px}.main{padding:18px 13px calc(100px + env(safe-area-inset-bottom))}.topbar{margin-bottom:18px}.page-title{font-size:28px}.grid.two,.grid.three,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.ability-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.skill-grid{grid-template-columns:1fr}.panel{border-radius:15px}.top-actions .btn .full-label{display:none}.character-switch{min-width:0;width:135px}.toolbar select{width:100%}}
@media print{body{background:white;color:#111}.sidebar,.topbar,.no-print{display:none!important}.app{display:block}.main{padding:0;max-width:none}.panel{box-shadow:none;border:1px solid #bbb;break-inside:avoid;background:white;color:#111}.stat,.ability{background:#f5f5f5;color:#111}.ability input{color:#111}}

/* --- Grimoire visual refresh --- */
:root{--bg:#090e1b;--surface:#101a2b;--surface2:#16243a;--surface3:#20324d;--line:#2a3c58;--gold:#e9bd72;--gold2:#f5d99f;--teal:#70d4c1;--shadow:0 20px 65px #02061188;--radius:20px}
body{background:radial-gradient(ellipse at 12% 0%,#c08a3820,transparent 32%),radial-gradient(ellipse at 90% 18%,#467a9a18,transparent 34%),linear-gradient(145deg,#080d18,#0d1727 55%,#0a1120);background-attachment:fixed}
.sidebar{background:linear-gradient(180deg,#111d30f2,#0c1525f5);border-right:1px solid #344762;box-shadow:12px 0 45px #02061133}
.brand-mark{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#f6d99d,#bb8336);box-shadow:0 8px 28px #d39d4b44;font-size:25px}
.brand strong{font-size:22px;letter-spacing:.01em}
.nav button{border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s}
.nav button:hover{border-color:#53698755;transform:translateX(2px)}
.nav button.active{background:linear-gradient(100deg,#d5a65328,#d5a6530a);border-color:#d5a65335;box-shadow:inset 3px 0 var(--gold),0 5px 18px #0002}
.main{padding-top:34px}
.topbar{padding:15px 18px;margin:-8px -12px 26px;border:1px solid #35496666;border-radius:18px;background:linear-gradient(110deg,#17253a99,#101a2b88);backdrop-filter:blur(14px)}
.eyebrow{font-size:10px;color:var(--gold2);letter-spacing:.22em}
.page-title{font-size:clamp(30px,4vw,44px);text-shadow:0 3px 25px #0005}
.panel{background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 97%,#d8b16a 3%),var(--surface));border-color:#354966;box-shadow:0 18px 55px #02061155,inset 0 1px #ffffff08;position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#d9ad62aa,transparent);pointer-events:none}
.panel-head{align-items:center}
.panel h2{font-size:25px;letter-spacing:-.02em}
.panel h3{font-size:16px;letter-spacing:.01em}
.btn,.icon-btn,.select-btn{transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}
.btn{border-radius:12px;font-weight:650;padding:10px 15px}
.btn.primary{background:linear-gradient(135deg,#f0cf8b,#c28b3f);box-shadow:0 5px 18px #c28b3f26;color:#21180c}
.btn.primary:hover{box-shadow:0 8px 25px #c28b3f44}
.btn.subtle{background:linear-gradient(135deg,var(--surface2),var(--surface))}
.icon-btn{border-radius:13px}
.stat,.ability,.content-card,.list-row{box-shadow:inset 0 1px #ffffff08;transition:transform .18s,border-color .18s,box-shadow .18s}
.stat:hover,.ability:hover,.content-card:hover,.list-row:hover{border-color:#b98d4e88;transform:translateY(-2px)}
.stat{background:linear-gradient(145deg,#1b2b43,#142137);padding:16px}
.stat .value{font-size:29px}
.ability{background:linear-gradient(145deg,#1b2b43,#142137);padding:12px 8px}
.content-card{background:linear-gradient(145deg,#1b2b43,#132037);border-radius:16px;padding:17px}
.content-card h3{font-size:18px}
.notice{background:linear-gradient(100deg,#c99b4d18,#67c8b608);border-color:#c99b4d66;border-radius:14px;padding:15px}
.source-toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:12px;align-items:center;margin:12px 0}
.source-search{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:0 12px;color:var(--gold);font-size:20px}
.source-search input{border:0;background:transparent;box-shadow:none!important;padding:12px 0;min-width:0}
.source-actions{display:flex;gap:8px;flex-wrap:wrap}
.source-actions .btn{white-space:nowrap}
.source-actions .is-complete{background:linear-gradient(135deg,#75d1b7,#3d9c87);border-color:#75d1b7;color:#071b18}
.source-summary{display:flex;align-items:center;gap:9px;padding:10px 13px;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:#0a1424aa}
.source-summary-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px #70d4c1aa}
.source-list{max-height:520px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;padding:3px}
.source-option{border-radius:12px;background:linear-gradient(145deg,var(--surface2),#101b2e);padding:11px 12px;min-height:58px;transition:transform .16s,border-color .16s,background .16s}
.source-option:hover{border-color:#c49a5d99;transform:translateY(-1px)}
.source-option:has(input:checked){border-color:#c49a5d99;background:linear-gradient(120deg,#c49a5d20,var(--surface2))}
.source-option input{accent-color:var(--gold);width:17px;height:17px}
.source-option span{line-height:1.4;font-weight:650}
.source-option small{font-weight:400}
.source-list:empty:after{content:"Lade Quellen, um sie hier auszuwählen.";display:block;color:var(--muted);padding:18px}
.progress{height:7px;border:1px solid #ffffff12}
.progress>i{background:linear-gradient(90deg,#b77d35,#f3d28e);box-shadow:0 0 12px #e9bd7277}
.toast{background:#1c2b42;border-color:#617a9c}
@media(max-width:760px){.source-toolbar{grid-template-columns:1fr}.source-actions{display:grid;grid-template-columns:1fr 1fr}.source-actions .btn{white-space:normal}.source-list{grid-template-columns:1fr 1fr;max-height:440px}.topbar{margin:0 0 18px;padding:12px;border-radius:15px}}
@media(max-width:420px){.source-list{grid-template-columns:1fr}.source-actions{grid-template-columns:1fr}}

/* Character builder selection experience */
.creation-intro-grid{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.5fr);gap:18px;align-items:start}
.creation-name-card{padding:18px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#1b2b43,#121e32)}
.creation-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wizard-choice-tile{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#1b2b43,#121e32);min-width:0}
.wizard-choice-tile.chosen{border-color:#d0a45f88;background:linear-gradient(120deg,#c99b4d20,#16243a)}
.wizard-choice-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#d1a65b1c;border:1px solid #d1a65b44;font-size:21px;color:var(--gold2)}
.wizard-choice-copy{min-width:0;display:grid;gap:2px}
.wizard-choice-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.wizard-choice-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wizard-choice-copy small{color:var(--muted);font-size:10px;line-height:1.35}
.wizard-choice-tile>.btn{padding:8px 10px;font-size:11px}
.wizard-picker{grid-column:1/-1;width:100%;min-width:0}
.picker-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
.picker-head strong,.picker-head small{display:block}.picker-head small{font-size:11px;color:var(--muted)}
.picker-search{margin-bottom:10px}
.picker-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:420px;overflow:auto;padding:2px}
.wizard-option-card{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);min-width:0;transition:.16s}
.wizard-option-card:hover{border-color:var(--gold);background:var(--surface3);transform:translateY(-1px)}
.wizard-option-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:10px;background:#d1a65b1c;color:var(--gold2);font-size:18px}
.wizard-option-main{display:grid;gap:3px;min-width:0}
.wizard-option-main strong{font-size:13px}
.wizard-option-main small{font:10px "DM Mono",monospace;color:var(--gold)}
.wizard-option-main span{font-size:11px;line-height:1.4;color:var(--muted)}
.wizard-option-arrow{margin-left:auto;color:var(--gold);font-size:17px}
@media(max-width:900px){.creation-intro-grid{grid-template-columns:1fr}.creation-picks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.creation-picks,.picker-cards{grid-template-columns:1fr}.wizard-choice-tile{grid-template-columns:38px minmax(0,1fr) auto;padding:10px}.wizard-choice-icon{width:38px;height:38px}.wizard-choice-tile>.btn{font-size:10px;padding:7px 8px}}
/* Interactive ability, skill and spell builder */
.ability-method-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(110deg,#1a2b43,#111d30)}
.ability-method-bar label{font-size:12px;font-weight:750;color:var(--gold2)}
.ability-method-bar select{max-width:210px;margin:0}
.ability-budget{margin-left:auto;color:var(--teal);font-size:12px;font-weight:750}
.ability-enhanced select{font-size:22px;font-weight:800;text-align:center;text-align-last:center;color:var(--gold2);background:#0a1322;border:1px solid #405575;border-radius:10px;padding:8px;width:100%}
.section-heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spell-picker-launch{display:flex;align-items:center;gap:12px;margin:14px 0}
.spell-picker-panel{margin:12px 0;padding:15px;border:1px solid #c99b4d66;border-radius:16px;background:linear-gradient(145deg,#17263b,#101a2c)}
.spell-filter-row{display:grid;grid-template-columns:1fr 150px;gap:9px;margin:10px 0}
.spell-picker-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:390px;overflow:auto}

<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">✦</div><div class="brand-copy"><strong>Grimoire</strong><small>5e character studio</small></div></div>
 <div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
  <button data-view="sheet" class="active"><span class="ico">▤</span><span class="nav-text">Charakterbogen</span></button>
  <button data-view="library"><span class="ico">⌕</span><span class="nav-text">Regelbibliothek</span></button>
  <button data-view="sources"><span class="ico">◈</span><span class="nav-text">Quellen & Homebrew</span></button>
  <button data-view="settings"><span class="ico">⚙</span><span class="nav-text">Einstellungen</span></button>
 </nav></div>
 <div class="side-bottom"><div class="sync-pill"><b>● Lokal gespeichert</b><br>Deine Daten bleiben in diesem Browser.</div><span class="small muted">Unofficial fan-made tool</span></div>
</aside>
<main class="main">
 <header class="topbar">
  <div><div class="eyebrow" id="eyebrow">Character workspace / 01</div><h1 class="page-title" id="pageTitle">Charakterbogen</h1></div>
  <div class="top-actions">
   <select id="characterSwitch" class="character-switch" aria-label="Charakter auswählen"></select>

   <button class="btn primary" id="quickSave">Speichern</button>
  </div>
 </header>
 <div id="view"></div>
</main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Details</h2><button class="icon-btn" id="modalClose" aria-label="Schließen">×</button></div><div class="divider"></div><div class="modal-content" id="modalBody"></div><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn subtle" id="modalDone">Schließen</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// Keep fatal startup errors visible instead of leaving an empty workspace.
window.addEventListener("error",event=>{
 const host=document.getElementById("view");
 if(host)host.innerHTML='<section class="panel"><h2>Grimoire konnte nicht starten</h2><p class="muted">Ein JavaScript-Fehler hat den Start unterbrochen:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:var(--red)"></pre><button class="btn primary" onclick="location.reload()">Neu laden</button></section>';
 const pre=host?.querySelector("pre");if(pre)pre.textContent=(event.message||"Unbekannter Fehler")+" · "+(event.filename||"")+" · Zeile "+(event.lineno||"?");
});
window.addEventListener("unhandledrejection",event=>{
 const host=document.getElementById("view");
 if(host){host.innerHTML='<section class="panel"><h2>Fehler beim Laden</h2><p class="muted">Eine Hintergrundoperation ist fehlgeschlagen:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:var(--red)"></pre></section>';host.querySelector("pre").textContent=String(event.reason?.stack||event.reason||"Unbekannter Fehler")}
});
const DATA_DEFAULT="https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data";
const BREW_API="https://api.github.com/repos/TheGiddyLimit/homebrew/git/trees/master?recursive=1";
const BREW_RAW="https://raw.githubusercontent.com/TheGiddyLimit/homebrew/master/";
const ABILITIES=[["str","Stärke"],["dex","Geschicklichkeit"],["con","Konstitution"],["int","Intelligenz"],["wis","Weisheit"],["cha","Charisma"]];
const SKILLS=[["acrobatics","Akrobatik","dex"],["animalHandling","Mit Tieren umgehen","wis"],["arcana","Arkane Kunde","int"],["athletics","Athletik","str"],["deception","Täuschen","cha"],["history","Geschichte","int"],["insight","Motiv erkennen","wis"],["intimidation","Einschüchtern","cha"],["investigation","Nachforschungen","int"],["medicine","Heilkunde","wis"],["nature","Naturkunde","int"],["perception","Wahrnehmung","wis"],["performance","Auftreten","cha"],["persuasion","Überzeugen","cha"],["religion","Religion","int"],["sleightOfHand","Fingerfertigkeit","dex"],["stealth","Heimlichkeit","dex"],["survival","Überlebenskunst","wis"]];
const CATEGORIES=[
 ["race","Spezies","races.json","race"],["subrace","Unterspezies","races.json","subrace"],["class","Klassen","class/index.json","class"],["subclass","Unterklassen","class/index.json","subclass"],
 ["background","Hintergründe","backgrounds.json","background"],["feat","Talente","feats.json","feat"],["spell","Zauber","spells/index.json","spell"],
 ["item","Ausrüstung & Gegenstände","items.json","item"],["optionalfeature","Optionale Features","optionalfeatures.json","optionalfeature"],
 ["classFeature","Klassenfeatures","class/index.json","classFeature"],["subclassFeature","Unterklassenfeatures","class/index.json","subclassFeature"]
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const blankCharacter=()=>({id:uid(),name:"Neuer Abenteurer",edition:"2024",level:1,race:null,subrace:null,class:null,subclass:null,background:null,alignment:"",experience:0,abilities:{str:10,dex:10,con:10,int:10,wis:10,cha:10},saveProficiencies:[],skillProficiencies:[],classSkillProficiencies:[],backgroundSkillProficiencies:[],expertise:[],hpMax:10,hpCurrent:10,tempHp:0,ac:10,speed:30,hitDice:"1d8",deathSuccess:0,deathFailure:0,spellAbility:"",spellSaveOverride:"",spellAttackOverride:"",proficiencyOverride:"",features:[],feats:[],spells:[],items:[],notes:"",personality:"",ideals:"",bonds:"",flaws:"",attacks:""});
const defaultState=()=>({dataBase:DATA_DEFAULT,activeSources:null,homebrew:[],characters:[blankCharacter()],activeId:null,theme:"dark"});
let state=defaultState(),cache=new Map(),brewCatalog=[],currentView="sheet",libraryCategory="race",libraryItems=[],librarySearch="",librarySource="all",busy=false,creationStep=0,wizardMode=false;
try{const saved=JSON.parse(localStorage.getItem("grimoire5e")||"null");if(saved&&typeof saved==="object")state={...defaultState(),...saved};}catch(e){}
if(!state.characters?.length)state.characters=[blankCharacter()];
// Migrate older local character records to the current schema without discarding user data.
const normalizeCharacter=raw=>{
 const base=blankCharacter(),c=raw&&typeof raw==="object"?raw:{};
 const arrays=["saveProficiencies","skillProficiencies","classSkillProficiencies","backgroundSkillProficiencies","expertise","features","feats","spells","items"];
 const normalized={...base,...c,id:c.id||base.id,abilities:{...base.abilities,...(c.abilities&&typeof c.abilities==="object"?c.abilities:{})}};
 for(const key of arrays)normalized[key]=Array.isArray(c[key])?c[key]:[];
 return normalized;
};
state.characters=state.characters.map(normalizeCharacter);
if(!state.activeId||!state.characters.some(c=>c.id===state.activeId))state.activeId=state.characters[0].id;
let character=()=>state.characters.find(c=>c.id===state.activeId)||state.characters[0];
const save=()=>{try{localStorage.setItem("grimoire5e",JSON.stringify(state));setStatus("Lokal gespeichert")}catch(e){setStatus("Speicher voll – exportiere Homebrew/Charaktere als Backup");toast("Browser-Speicherlimit erreicht. Bitte exportiere deine Daten.")}};
function setStatus(t){const n=$("saveStatus");if(n)n.textContent=t}
function toast(t){const n=$("toast");n.textContent=t;n.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>n.classList.remove("show"),2400)}
function mod(v){return Math.floor((Number(v||0)-10)/2)}
function fmtMod(v){return (v>=0?"+":"")+v}
function profBonus(c=character()){return Number(c.proficiencyOverride)||Math.ceil(Math.max(1,Math.min(20,Number(c.level)||1))/4)+1}
function abilityMod(k,c=character()){return mod(c.abilities?.[k]??10)}
function derivedSkill(skill,c=character()){const p=profBonus(c),base=abilityMod(skill[2],c);return base+(c.expertise?.includes(skill[0])?p*2:c.skillProficiencies?.includes(skill[0])?p:0)}
function escText(x){if(typeof x==="string")return x;if(typeof x==="number")return String(x);if(Array.isArray(x))return x.map(escText).filter(Boolean).join("\n");if(x&&typeof x==="object"){if(x.type==="entries"||x.type==="section")return [x.name,escText(x.entries)].filter(Boolean).join("\n");if(x.type==="list")return (x.items||[]).map(escText).join("\n");if(x.type==="item")return [x.name,escText(x.entry)].filter(Boolean).join(": ");if(x.entry)return escText(x.entry);if(x.entries)return escText(x.entries);if(x.name)return x.name;}return ""}
function flattenEntries(x){return escText(x).replace(/\{@(.*?)\}/g,(_,v)=>v.split("|")[0].replace(/^[a-z]+ /,"")).replace(/<[^>]*>/g,"")}
async function fetchJson(url){if(cache.has(url))return cache.get(url);const p=fetch(url).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status} bei ${url}`);return r.json()}).catch(e=>{cache.delete(url);throw e});cache.set(url,p);return p}
function dataUrl(path){return state.dataBase.replace(/\/+$/,"")+"/"+path}
function is2024(x){return x?.edition==="one"||x?.source==="XPHB"||x?.source==="XDMG"||x?.source==="XMM"}
function editionOk(x){return character().edition==="2024"?is2024(x):!is2024(x)}
function sourceOk(x){const src=x?.source||"Unknown";return !Array.isArray(state.activeSources)||state.activeSources.includes(src)}
function selectedBrew(){return state.homebrew.filter(x=>x.enabled)}
async function getBrewData(b){if(b.data)return b.data;if(!b.url)throw Error("Homebrew-Datei hat keine URL");b.data=await fetchJson(b.url);return b.data}
async function getActiveBrews(){const out=[];for(const b of selectedBrew()){try{out.push({meta:b,data:await getBrewData(b)})}catch(e){console.warn(e)}}return out}
function getArray(data,key){return Array.isArray(data?.[key])?data[key]:[]}
function resolveCopies(items){const by=new Map(items.map(x=>[`${x.name}|${x.source}`,x]));return items.map(x=>{if(!x._copy)return x;const base=by.get(`${x._copy.name}|${x._copy.source}`);return base?{...base,...x,_copy:undefined}:x})}
function sourceNamesFrom(data){return (data?._meta?.sources||[]).map(s=>s.json).filter(Boolean)}
async function getClassFiles(){const idx=await fetchJson(dataUrl("class/index.json"));return Object.entries(idx).map(([key,path])=>({key,path}))}
async function loadCategory(cat){
 const spec=CATEGORIES.find(x=>x[0]===cat);if(!spec)throw Error("Unbekannte Kategorie");
 const [,label,path,key]=spec;let official=[];
 if(cat==="class"||cat==="subclass"||cat==="classFeature"||cat==="subclassFeature"){
  const files=await getClassFiles();
  const results=await Promise.all(files.map(async f=>{try{return await fetchJson(dataUrl("class/"+f.path))}catch(e){return null}}));
  for(const d of results.filter(Boolean))official.push(...getArray(d,key));
 }else if(cat==="spell"){
  const idx=await fetchJson(dataUrl("spells/index.json"));
  const entries=await Promise.all(Object.entries(idx).map(async([src,file])=>{try{const d=await fetchJson(dataUrl("spells/"+file));return getArray(d,"spell").map(x=>({...x,_indexSource:src}))}catch(e){return []}}));
  official=entries.flat();
 }else{
  const d=await fetchJson(dataUrl(path));official=getArray(d,key);
  if(cat==="item")official=[...official,...getArray(d,"baseitem")];
 }
 const brews=await getActiveBrews();
 const home=brews.flatMap(b=>getArray(b.data,key).map(x=>({...x,_homebrewName:b.meta.name,_homebrew:true})));
 let all=resolveCopies([...official,...home]);
 all=all.filter(x=>sourceOk(x)&&editionOk(x));
 if(cat==="classFeature"||cat==="subclassFeature")all=all.filter(x=>x.name);
 return all;
}
function sourceInfo(x){return x?.source||x?._indexSource||"Unknown source"}
function categoryIcon(cat){return ({race:"🧬",class:"⚔",subclass:"✦",background:"📜",feat:"◇",spell:"✧",item:"⚒",optionalfeature:"✺",classFeature:"☼",subclassFeature:"✧"})[cat]||"◈"}
function sourceBadge(x){return x._homebrew?'<span class="tag homebrew">Homebrew</span>':`<span class="tag">${esc(sourceInfo(x))}</span>`}
function renderNav(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView))}
function setView(v){currentView=v;renderNav();renderView();window.scrollTo({top:0,behavior:"smooth"})}
function renderHeader(){const c=character();$("characterSwitch").innerHTML=state.characters.map(x=>`<option value="${esc(x.id)}">${esc(x.name||"Unbenannt")}</option>`).join("");$("characterSwitch").value=c.id}
function renderView(){try{renderHeader();const titles={sheet:["Character sheet","Charakterbogen"],library:["Compendium","Regelbibliothek"],sources:["Content management","Quellen & Homebrew"],settings:["Preferences","Einstellungen"]};$("eyebrow").textContent=titles[currentView][0]+" / "+String(["sheet","library","sources","settings"].indexOf(currentView)+1).padStart(2,"0");$("pageTitle").textContent=titles[currentView][1];({sheet:renderSheet,library:renderLibrary,sources:renderSources,settings:renderSettings})[currentView]()}catch(err){console.error("Grimoire render error",err);const host=$("view");if(host)host.innerHTML=panel("Ansicht konnte nicht geladen werden","Ein Darstellungsfehler wurde abgefangen.",`<div class="notice"><strong>${esc(err?.message||"Unbekannter Fehler")}</strong><p class="small muted">Bitte Seite neu laden. Deine lokal gespeicherten Charakterdaten bleiben erhalten.</p><button class="btn primary" id="retryRender">Erneut versuchen</button></div>`);$("retryRender")?.addEventListener("click",renderView)}}
function panel(title,sub,body,actions=""){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${sub?`<div class="muted small">${sub}</div>`:""}</div>${actions}</div>${body}</section>`}
function field(id,label,value,opts={}){return `<div class="field"><label for="${id}">${label}</label>${opts.area?`<textarea id="${id}" data-field="${opts.key||id}">${esc(value)}</textarea>`:`<input id="${id}" data-field="${opts.key||id}" type="${opts.type||"text"}" value="${esc(value)}" ${opts.min!==undefined?`min="${opts.min}"`:""} ${opts.max!==undefined?`max="${opts.max}"`:""}>`}</div>`}
const wizardOptionCache={};
function wizardChoiceTile(cat,label,value,icon,sub){
 const chosen=value?.name;
 return `<div class="wizard-choice-tile ${chosen?"chosen":""}"><div class="wizard-choice-icon">${icon}</div><div class="wizard-choice-copy"><span class="wizard-choice-label">${label}</span><strong>${esc(chosen||"Noch nicht gewählt")}</strong><small>${esc(chosen?(value.source||"Ausgewählt"):sub)}</small></div><button class="btn ${chosen?"subtle":"primary"}" type="button" data-open-picker="${cat}">${chosen?"Ändern":"Auswählen"}</button><div class="wizard-picker" data-picker="${cat}"></div></div>`;
}
async function openWizardPicker(cat){
 const host=document.querySelector(`[data-picker="${cat}"]`);if(!host)return;
 if(cat==="subclass"&&!character().class){host.innerHTML='<p class="muted small">Bitte wähle zuerst eine Klasse.</p>';return}
 if(cat==="subrace"&&!character().race){host.innerHTML='<p class="muted small">Bitte wähle zuerst eine Spezies.</p>';return}
 host.innerHTML='<p class="muted small">Lade Auswahlmöglichkeiten …</p>';
 try{
  let options=await loadCategory(cat);
  if(cat==="subclass"&&character().class)options=options.filter(x=>!x.className||x.className===character().class.name);
  if(cat==="subrace"&&character().race)options=options.filter(x=>!x.raceName||x.raceName===character().race.name);
  wizardOptionCache[cat]=options;
  const names={race:"Spezies",subrace:"Unterspezies",class:"Klassen",subclass:"Unterklassen",background:"Hintergründe"};
  host.innerHTML=`<div class="picker-head"><div><strong>${names[cat]} auswählen</strong><small>${options.length} verfügbare Optionen aus deinen aktivierten Quellen</small></div><button class="icon-btn" type="button" data-close-picker="${cat}">×</button></div><input class="picker-search" type="search" placeholder="${names[cat]} durchsuchen …" data-picker-search="${cat}"><div class="picker-cards" data-picker-cards="${cat}">${wizardOptionCards(cat,options)}</div>`;
  const cards=host.querySelector(`[data-picker-cards="${cat}"]`);
  cards.onclick=e=>{const button=e.target.closest("[data-select-option]");if(button)chooseWizardOption(cat,Number(button.dataset.selectOption))};
  host.querySelector(`[data-picker-search="${cat}"]`).oninput=e=>{const q=e.target.value.toLowerCase();cards.innerHTML=wizardOptionCards(cat,options.filter(x=>`${x.name} ${sourceInfo(x)} ${flattenEntries(x.entries||"")}`.toLowerCase().includes(q)))};
  host.querySelector(`[data-close-picker="${cat}"]`).onclick=()=>host.innerHTML="";
 }catch(e){host.innerHTML=`<div class="empty">Optionen konnten nicht geladen werden: ${esc(e.message)}</div>`}
}
function wizardOptionCards(cat,items){
 if(!items.length)return '<div class="empty">Keine passenden Optionen gefunden. Prüfe deine aktivierten Quellen.</div>';
 const icon={race:"🧬",subrace:"✧",class:"⚔",subclass:"✦",background:"📜"}[cat]||"✧";
 return items.slice(0,180).map((x,i)=>{const desc=flattenEntries(x.entries||x.description||x.entry||"").slice(0,150);return `<button type="button" class="wizard-option-card" data-select-option="${i}"><span class="wizard-option-icon">${icon}</span><span class="wizard-option-main"><strong>${esc(x.name)}</strong><small>${esc(sourceInfo(x))}</small><span>${esc(desc||"Keine Kurzbeschreibung in den geladenen Daten.")}</span></span><span class="wizard-option-arrow">↗</span></button>`}).join("");
}
function chooseWizardOption(cat,index){
 const x=wizardOptionCache[cat]?.[index];if(!x)return;
 const c=character(),simple={...x,name:x.name,source:sourceInfo(x),_homebrew:!!x._homebrew};
 if(cat==="race"){c.race=simple;c.subrace=null}
 if(cat==="subrace")c.subrace=simple;
 if(cat==="class"){c.class=simple;c.subclass=null;if(x.hd?.faces)c.hitDice=`1d${x.hd.faces}`}
 if(cat==="subclass")c.subclass=simple;
 if(cat==="background")c.background=simple;

async function loadSourceCatalog(){
 const box=$("sourceChoices"),status=$("sourceStatus");status.textContent="Ermittle verfügbare Quellen …";
 try{
  const found=new Map();
  const add=(code,full,homebrew=false)=>{
   if(!code)return;
   const prior=found.get(code);
   found.set(code,{json:code,full:full||prior?.full||code,abv:code,homebrew:homebrew||prior?.homebrew||false});
  };
  const addMeta=data=>(data?._meta?.sources||[]).forEach(s=>add(s.json,s.full||s.abbreviation||s.json));
  const paths=["races.json","backgrounds.json","feats.json","items.json","optionalfeatures.json","class/index.json","spells/index.json"];
  const results=await Promise.allSettled(paths.map(path=>fetchJson(dataUrl(path))));
  results.forEach((result,i)=>{
   if(result.status!=="fulfilled")return;
   const data=result.value;addMeta(data);
   if(paths[i]==="class/index.json"||paths[i]==="spells/index.json"){
    Object.keys(data||{}).forEach(code=>add(code,code));
   }
  });
  const brews=await getActiveBrews();
  const brewNames=brews.flatMap(x=>(x.data._meta?.sources||[]).map(s=>({json:s.json,full:s.full||s.json,abv:s.abbreviation||s.json,homebrew:true}))).filter(x=>x.json);
  brewNames.forEach(x=>add(x.json,x.full,true));
  const names=[...found.values()].sort((a,b)=>a.full.localeCompare(b.full));
  if(!names.length)throw Error("Keine Quellen-Metadaten gefunden. Prüfe die Datenbasis und Internetverbindung.");
  if(!Array.isArray(state.activeSources))state.activeSources=names.map(x=>x.json);
  else{
   const seen=new Set(state.homebrewSourceSeen||[]);
   const newlyFound=brewNames.map(x=>x.json).filter(x=>!seen.has(x));
   state.activeSources=[...new Set([...state.activeSources,...newlyFound])];
   state.homebrewSourceSeen=[...seen,...newlyFound];
  }
  state._sourceCatalog=names;save();
  drawSources(names);status.textContent=`${names.length} Quellen gefunden · ${state.activeSources.length} aktiviert.`;
 }catch(e){status.textContent="Quellen konnten nicht ermittelt werden: "+e.message;console.warn(e)}
}

async function loadBrewCatalog(){
 const status=$("brewStatus");status.textContent="Lade Homebrew-Katalog …";
 try{
  // Der kompakte Index aus dem Raw-Repository ist stabiler als die GitHub-Tree-API
  // und vermeidet deren nicht authentifizierte API-Ratenlimits.
  const index=await fetchJson(BREW_RAW+"_generated/index-sources.json");
  brewCatalog=Object.entries(index||{}).map(([source,path])=>({name:source,path,url:BREW_RAW+path.split("/").map(encodeURIComponent).join("/")})).sort((a,b)=>a.name.localeCompare(b.name));
  if(!brewCatalog.length)throw Error("Der Homebrew-Index enthält keine Einträge.");
  drawBrewCatalog();status.textContent=`${brewCatalog.length} Homebrew-Quellen gefunden. Suche nach einem Namen oder Dateipfad.`;
 }catch(e){
  status.textContent="Homebrew-Katalog konnte nicht geladen werden. Prüfe die Internetverbindung oder importiere eine JSON-Datei/Raw-URL.";
  console.warn("Homebrew index loading failed:",e);
 }
}

 <div class="divider"></div><h3>Datensicherung & PC-Übertragung</h3><p class="muted small">Exportiere alle Charaktere, Quellen, Homebrew-Dateien und Einstellungen in eine Sicherungsdatei. Importiere diese Datei anschließend auf deinem PC, um dort denselben Stand zu übernehmen.</p><div class="row"><button class="btn primary" id="exportBackup">Komplettes Grimoire exportieren</button><label class="btn subtle" for="importBackup" style="margin:0;cursor:pointer">Sicherung importieren</label><input id="importBackup" type="file" accept=".json,application/json" hidden></div><p class="status" id="backupStatus"></p>
 <div class="divider"></div><h3>Darstellung & Daten</h3><div class="row"><button class="btn subtle" id="toggleTheme">${state.theme==="dark"?"Hellmodus aktivieren":"Dunkelmodus aktivieren"}</button><button class="btn subtle" id="clearCache">Daten-Cache leeren</button><button class="btn danger" id="resetApp">Lokale App-Daten zurücksetzen</button></div>
 <div class="divider"></div><h3>Über Grimoire</h3><p class="muted small">Grimoire ist ein inoffizieller, lokal gespeicherter D&D-5e-Charaktermanager. Regel- und Homebrew-Daten werden zur Laufzeit aus externen JSON-Quellen geladen. Deine Charakterdaten werden nicht an einen Server übertragen.</p><p class="muted small">Hinweis: Diese App automatisiert nicht sämtliche Sonderregeln, Voraussetzungen, Klassenprogressionen oder Zaubereffekte. Prüfe regelrelevante Entscheidungen anhand deiner erlaubten Bücher und mit deiner Spielleitung.</p>`;
 $("view").innerHTML=panel("Einstellungen","Passe Datenquellen, Charaktere und Darstellung an.",body);
 $("defaultEdition").value=character().edition;
 $("defaultEdition").onchange=e=>{character().edition=e.target.value;save();toast("Regelwerk geändert")};
 $("view").querySelector('[data-field="dataBase"]').addEventListener("change",e=>{state.dataBase=e.target.value.replace(/\/+$/,"");cache.clear();save();toast("Datenbasis aktualisiert")});
 $("newCharacter").onclick=()=>newCharacter();$("exportAll").onclick=()=>downloadJson(state.characters,"grimoire-characters.json");
 $("exportBackup").onclick=()=>{const backup={app:"Grimoire D&D 5e Character Manager",formatVersion:1,exportedAt:new Date().toISOString(),state:{...state}};downloadJson(backup,"grimoire-backup.json");$("backupStatus").textContent="Komplette Sicherung wurde erstellt."};
 $("importBackup").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());const restored=data?.app==="Grimoire D&D 5e Character Manager"?data.state:data;if(!restored||!Array.isArray(restored.characters)||!restored.characters.length)throw Error("Das ist keine gültige Grimoire-Sicherung.");if(!confirm("Die aktuelle lokale App-Konfiguration einschließlich Charakteren und Quellen durch die Sicherung ersetzen?"))return;state={...defaultState(),...restored};if(!state.activeId||!state.characters.some(c=>c.id===state.activeId))state.activeId=state.characters[0].id;cache.clear();brewCatalog=[];save();renderView();$("backupStatus").textContent="Sicherung erfolgreich importiert. Grimoire wurde wiederhergestellt." ;toast("Sicherung importiert")}catch(err){$("backupStatus").textContent="Import fehlgeschlagen: "+err.message;toast("Sicherungsdatei konnte nicht importiert werden")}finally{e.target.value=""}};
 $("importChars").onchange=async e=>{for(const f of [...e.target.files])try{const d=JSON.parse(await f.text()),arr=Array.isArray(d)?d:[d];for(const x of arr){if(x&&typeof x==="object"&&x.name){const c={...blankCharacter(),...x,id:uid(),abilities:{...blankCharacter().abilities,...x.abilities}};state.characters.push(c)}}}catch(err){toast(`${f.name}: Import fehlgeschlagen`)}state.activeId=state.characters.at(-1).id;save();renderView();e.target.value=""};
 $("toggleTheme").onclick=toggleTheme;$("clearCache").onclick=()=>{cache.clear();toast("Daten-Cache geleert")};
 $("resetApp").onclick=()=>{if(confirm("Alle Charaktere, Quellen- und Homebrew-Einstellungen lokal löschen?")){localStorage.removeItem("grimoire5e");state=defaultState();state.activeId=state.characters[0].id;cache.clear();renderView();toast("Zurückgesetzt")}};
}
function newCharacter(){const c=blankCharacter();c.name="Abenteurer "+(state.characters.length+1);state.characters.push(c);state.activeId=c.id;save();renderView();toast("Neuer Charakter erstellt")}
function deleteCharacter(){if(state.characters.length===1){toast("Mindestens ein Charakter muss vorhanden sein.");return}if(!confirm("Diesen Charakter wirklich löschen?"))return;state.characters=state.characters.filter(c=>c.id!==state.activeId);state.activeId=state.characters[0].id;save();renderView()}
function toggleTheme(){state.theme=state.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=state.theme;save();$("themeToggle").textContent=state.theme==="dark"?"☼":"☾"}
$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("characterSwitch").onchange=e=>{state.activeId=e.target.value;save();renderView()};
$("themeToggle").onclick=toggleTheme;$("quickSave").onclick=()=>{save();toast("Gespeichert")};
$("modalClose").onclick=$("modalDone").onclick=()=>$("modal").classList.remove("open");
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("open")};
document.documentElement.dataset.theme=state.theme;$("themeToggle").textContent=state.theme==="dark"?"☼":"☾";
renderView();
</script>
</body>
</html>
