
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          lower = html.lower()
          start = lower.find("<script")
          if start < 0: raise SystemExit("No inline JavaScript found")
          start = html.find(">", start) + 1
          end = lower.find("</script>", start)
          if end < 0: raise SystemExit("Unclosed inline script")
          open("/tmp/grimoire-inline.js", "w", encoding="utf-8").write(html[start:end])
          PY
          node --check /tmp/grimoire-inline.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
